name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -O2 -Wall -Wextra -pthread -o proxy main.c
      - name: Run tests
        run: python3 tests/test_proxy.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t llm-caching-proxy .
      - name: Send requests through the container
        run: |
          # Fake Ollama on the runner, proxy in Docker, then the same request twice
          python3 -c "import sys, time; sys.path.insert(0, 'tests'); from mock_ollama import MockOllama; MockOllama(delay=0); time.sleep(300)" &
          docker run -d --name proxy --network host -e UPSTREAM=127.0.0.1:11434 llm-caching-proxy
          sleep 2
          docker logs proxy | grep "LLM caching proxy on :8080"
          BODY='{"model":"llama3","prompt":"docker test","stream":false}'
          curl -si http://localhost:8080/api/generate -d "$BODY" | tee first.txt
          curl -si http://localhost:8080/api/generate -d "$BODY" | tee second.txt
          grep -q "X-Cache: MISS" first.txt
          grep -q "X-Cache: HIT" second.txt
          grep -q "docker test" second.txt
